
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Yuna AI</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html,body {
  width:100%;
  height:100%;
  overflow:hidden;
  background:#100d20;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#stage {
  position:fixed;
  inset:0;
}

canvas {
  display:block;
  width:100%;
  height:100%;
}

#top {
  position:fixed;
  top:0;
  left:0;
  right:0;
  padding:25px 20px;
  color:white;
  pointer-events:none;
  background:linear-gradient(#100d20bb,transparent);
}

#top h2 { font-size:23px; }

#top p {
  font-size:12px;
  color:#d5c9ff;
  margin-top:5px;
}

#status {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  text-align:center;
  font-size:14px;
}

#reaction {
  position:fixed;
  top:90px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:#8c62c9dd;
  padding:10px 20px;
  border-radius:30px;
  opacity:0;
  transition:opacity .25s;
  pointer-events:none;
}

#bottom {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:25px 15px;
  color:white;
  text-align:center;
  font-size:12px;
  background:linear-gradient(transparent,#100d20bb);
  pointer-events:none;
}
</style>
</head>

<body>

<div id="stage"></div>

<div id="top">
  <h2>Yuna 🌸</h2>
  <p>Your 3D AI Companion</p>
</div>

<div id="status">Memuat Yuna...</div>
<div id="reaction">Yuna senang! 💜</div>
<div id="bottom">Geser untuk memutar • Sentuh untuk berinteraksi</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.2.0/lib/three-vrm.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";

const stage = document.getElementById("stage");
const status = document.getElementById("status");
const reaction = document.getElementById("reaction");

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color("#171128");

// CAMERA
const camera = new THREE.PerspectiveCamera(
  35, innerWidth/innerHeight, 0.01, 100
);

// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:false
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.HemisphereLight(
  0xffffff,0x675080,2
));

const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(2,4,5);
scene.add(light);

// CAMERA CONTROL
let target = new THREE.Vector3(0,0.8,0);
let distance = 3;
let angle = 0;
let vertical = 0.08;

function updateCamera() {
  camera.position.set(
    target.x + Math.sin(angle)*distance,
    target.y + vertical*distance,
    target.z + Math.cos(angle)*distance
  );
  camera.lookAt(target);
}

updateCamera();

// VRM
let vrm = null;
const bones = {};
const base = {};

const boneNames = [
  "hips",
  "spine",
  "chest",
  "upperChest",
  "neck",
  "head",
  "leftUpperArm",
  "rightUpperArm",
  "leftLowerArm",
  "rightLowerArm"
];

function getBone(name) {
  return vrm?.humanoid?.getNormalizedBoneNode(name) || null;
}

function saveBones() {
  boneNames.forEach(name => {
    const bone = getBone(name);
    if (!bone) return;

    bones[name] = bone;

    base[name] = {
      x:bone.rotation.x,
      y:bone.rotation.y,
      z:bone.rotation.z,
      px:bone.position.x,
      py:bone.position.y,
      pz:bone.position.z
    };
  });
}

// LOAD MODEL
const loader = new GLTFLoader();

loader.register(parser => new VRMLoaderPlugin(parser));

loader.load(
  "assets/models/yuna.vrm",

  gltf => {

    vrm = gltf.userData.vrm;

    if (!vrm) {
      status.textContent = "VRM tidak terbaca!";
      return;
    }

    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.removeUnnecessaryJoints(gltf.scene);
    VRMUtils.rotateVRM0(vrm);

    vrm.scene.traverse(obj => {
      obj.frustumCulled = false;
    });

    scene.add(vrm.scene);

    const box = new THREE.Box3().setFromObject(vrm.scene);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    target.copy(center);
    distance = Math.max(size.y,1)*2.15;

    camera.updateProjectionMatrix();
    updateCamera();

    saveBones();

    status.style.display = "none";

    console.log("Yuna loaded");
    console.log("Available bones:",Object.keys(bones));

  },

  undefined,

  error => {
    console.error(error);
    status.textContent = "Gagal memuat model VRM!";
  }
);

// ANIMATION SETTINGS

const clock = new THREE.Clock();

let elapsed = 0;
let blinkTimer = 0;
let blinkValue = 0;
let happyTimer = 0;
let touchReaction = 0;

function smoothStep(x) {
  x = THREE.MathUtils.clamp(x,0,1);
  return x*x*(3-2*x);
}

function animateBone(name,x,y,z) {
  const bone = bones[name];
  const b = base[name];

  if (!bone || !b) return;

  bone.rotation.set(
    b.x+x,
    b.y+y,
    b.z+z
  );
}

// IDLE ANIMATION
function updateYuna(dt) {

  if (!vrm) return;

  elapsed += dt;

  const t = elapsed;

  // PROGRESS TRANSISI DARI T-POSE
  const armBlend = smoothStep(t/2.5);

  // GERAKAN NAPAS
  const breathing = Math.sin(t*1.5);

  // BODY SWAY
  const sway = Math.sin(t*0.8);

  // HIPS
  animateBone(
    "hips",
    0,
    sway*0.015,
    0
  );

  if (bones.hips) {
    const b = base.hips;
    bones.hips.position.y =
      b.py + breathing*0.008;
  }

  // SPINE
  animateBone(
    "spine",
    breathing*0.012,
    0,
    sway*0.008
  );

  // CHEST
  animateBone(
    "chest",
    breathing*0.009,
    0,
    0
  );

  // UPPER CHEST
  animateBone(
    "upperChest",
    breathing*0.006,
    0,
    0
  );

  // NECK
  animateBone(
    "neck",
    Math.sin(t*0.7)*0.012,
    Math.sin(t*0.45)*0.025,
    0
  );

  // HEAD
  animateBone(
    "head",
    Math.sin(t*0.7)*0.025,
    Math.sin(t*0.45)*0.055,
    Math.sin(t*0.9)*0.018-touchReaction*0.12
  );

  // ARM DROP
  // VRM NORMALIZED LEFT/RIGHT ARM
  const leftDrop = -1.05 * armBlend;
  const rightDrop = 1.05 * armBlend;

  animateBone(
    "leftUpperArm",
    Math.sin(t*0.8)*0.012,
    0,
    leftDrop + Math.sin(t*0.9)*0.012
  );

  animateBone(
    "rightUpperArm",
    -Math.sin(t*0.8)*0.012,
    0,
    rightDrop - Math.sin(t*0.9)*0.012
  );

  // ELBOW
  animateBone(
    "leftLowerArm",
    0,
    0,
    -0.08*armBlend
  );

  animateBone(
    "rightLowerArm",
    0,
    0,
    0.08*armBlend
  );

  // BLINK
  blinkTimer -= dt;

  if (blinkTimer <= 0) {
    blinkValue = 0.18;
    blinkTimer = 3.5 + Math.random()*2.5;
  }

  if (blinkValue > 0) {
    blinkValue = Math.max(0,blinkValue-dt*5);
  }

  if (vrm.expressionManager) {
    try {
      vrm.expressionManager.setValue(
        "blink",
        blinkValue
      );

      vrm.expressionManager.setValue(
        "happy",
        happyTimer > 0 ? 0.8 : 0
      );
    } catch(e) {
      console.log("Expression tidak tersedia",e);
    }
  }

  happyTimer = Math.max(0,happyTimer-dt);
  touchReaction = Math.max(0,touchReaction-dt*2);

  // VRM UPDATE HANYA SEKALI PER FRAME
  vrm.update(dt);
}

// TOUCH SYSTEM
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

let dragging = false;
let startX = 0;
let startY = 0;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener("pointerdown",e => {
  dragging = true;

  startX = lastX = e.clientX;
  startY = lastY = e.clientY;
});

window.addEventListener("pointermove",e => {

  if (!dragging) return;

  const dx = e.clientX-lastX;
  const dy = e.clientY-lastY;

  angle -= dx*0.008;

  vertical = THREE.MathUtils.clamp(
    vertical+dy*0.003,
    -0.5,
    0.5
  );

  lastX = e.clientX;
  lastY = e.clientY;

  updateCamera();
});

window.addEventListener("pointerup",e => {

  if (!dragging) return;

  dragging = false;

  const moved = Math.hypot(
    e.clientX-startX,
    e.clientY-startY
  );

  if (moved > 12 || !vrm) return;

  const rect = renderer.domElement.getBoundingClientRect();

  pointer.x =
    ((e.clientX-rect.left)/rect.width)*2-1;

  pointer.y =
    -((e.clientY-rect.top)/rect.height)*2+1;

  raycaster.setFromCamera(pointer,camera);

  const hits = raycaster.intersectObject(
    vrm.scene,true
  );

  if (hits.length) {

    happyTimer = 1.5;
    touchReaction = 1;

    reaction.textContent = "Yuna senang! 💜";
    reaction.style.opacity = "1";

    setTimeout(() => {
      reaction.style.opacity = "0";
    },1200);

  }
});

// ZOOM
renderer.domElement.addEventListener("wheel",e => {

  distance = THREE.MathUtils.clamp(
    distance+e.deltaY*0.005,
    0.8,
    10
  );

  updateCamera();
});

// RESIZE
window.addEventListener("resize",() => {

  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);

});

// MAIN LOOP
function animate() {

  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(),0.05);

  updateYuna(dt);

  renderer.render(scene,camera);
}

animate();

</script>
</body>
</html>
